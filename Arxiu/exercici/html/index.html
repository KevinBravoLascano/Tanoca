<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualitzador de dades MovieLens</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Visualitzador de dades MovieLens</h1>

    <section id="file-input-section" aria-labelledby="file-input-title">
      <h2 id="file-input-title">Carrega de dades</h2>
      <label for="csv-file">Selecciona un fitxer CSV</label>
      <input id="csv-file" name="csv-file" type="file" accept=".csv,text/csv">
    </section>

    <section id="summary" aria-labelledby="summary-title">
      <h2 id="summary-title">Resum estadístic</h2>
      <div id="stats-summary">
        <p><strong>Total de pel·lícules úniques:</strong> <span id="unique-movies-count">0</span></p>
        <p><strong>Total d'usuaris únics:</strong> <span id="unique-users-count">0</span></p>
        <p><strong>Total de valoracions:</strong> <span id="ratings-count">0</span></p>
        <p><strong>Mitjana de rating:</strong> <span id="average-rating">0</span></p>
      </div>
    </section>

    <section id="data-table" aria-labelledby="data-table-title">
      <h2 id="data-table-title">Dades</h2>
      <div class="table-controls" aria-label="Controls de la taula">
        <button id="sort-rating" type="button">Ordena per rating: més alt primer</button>
        <button id="previous-page" type="button" disabled>Pàgina anterior</button>
        <span id="page-indicator" aria-live="polite">Pàgina 1</span>
        <button id="next-page" type="button" disabled>Pàgina següent</button>
      </div>
      <p id="empty-state" hidden>No hi ha dades disponibles.</p>
      <table>
        <thead></thead>
        <tbody></tbody>
      </table>
    </section>

    <section id="chart-section" aria-labelledby="chart-title">
      <h2 id="chart-title">Valoració mitjana per gènere</h2>
      <div id="chart-container"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
